<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RTW Digital Catalogue</title>
  <link rel="icon" type="image/svg+xml" href="v-logo.svg">
  <link rel="alternate icon" type="image/png" href="v-favicon.png">
  <link rel="apple-touch-icon" href="v-favicon.png">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Valentino">
        <img class="brand-logo" src="v-logo.svg" alt="Valentino">
      </a>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <p class="page-title">Ready-to-Wear Digital Catalogue</p>
      <div class="toolbar-filters">
        <div class="segmented" id="genderFilter" role="tablist">
          <button class="seg" data-gender="all">All</button>
          <button class="seg" data-gender="women">Woman</button>
          <button class="seg" data-gender="men">Man</button>
        </div>
        <button type="button" class="filter-trigger" id="filterTrigger" aria-haspopup="dialog" aria-expanded="false">Filter by</button>
      </div>
    </div>
  </div>

  <!-- Filter drawer -->
  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <aside class="drawer" id="filterDrawer" aria-hidden="true" aria-label="Filter by">
    <div class="drawer-head">
      <span class="drawer-title">Filter by</span>
      <button type="button" class="drawer-close" id="drawerClose" aria-label="Close">&times;</button>
    </div>
    <div class="drawer-body">
      <section class="drawer-section">
        <h3 class="drawer-section-title">Category</h3>
        <ul class="drawer-options" id="categoryOptions" role="listbox"></ul>
      </section>
      <section class="drawer-section">
        <h3 class="drawer-section-title">Sizes</h3>
        <div class="drawer-sizes" id="sizeOptions"></div>
      </section>
    </div>
    <div class="drawer-foot">
      <button type="button" class="drawer-clear" id="drawerClear">Clear</button>
      <button type="button" class="drawer-apply" id="drawerApply">Apply</button>
    </div>
  </aside>

  <main class="content">
    <div class="results-info" id="resultsInfo">Loading…</div>
    <div class="grid" id="grid"></div>
    <div id="sentinel" class="sentinel"></div>
    <div class="empty" id="empty" hidden>No products match the selected filters.</div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-content">
      <button class="lb-close" id="lbClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
      </button>
      <div class="lb-gallery">
        <div class="lb-main">
          <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">
            <svg viewBox="0 0 16 24" width="11" height="18" aria-hidden="true"><path d="M13 3L4 12l9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <img id="lbImg" alt="">
          <button class="lb-nav lb-next" id="lbNext" aria-label="Next">
            <svg viewBox="0 0 16 24" width="11" height="18" aria-hidden="true"><path d="M3 3l9 9-9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="lb-thumbs" id="lbThumbs"></div>
      </div>
      <div class="lb-info" id="lbInfo"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Confidential internal catalogue</p>
  </footer>

  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
